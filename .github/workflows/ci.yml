# Pipeline del POS (Sprint 5): cada push a una rama feature/, develop o main,
# y cada Pull Request, pasa por: instalar → pruebas → build → smoke test.
# Si un paso falla, el pipeline se detiene y el PR no debe mergearse.
name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # MongoDB desechable solo para el pipeline (nunca la base de Atlas)
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/cafecito_test

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 2. Instalar dependencias (backend + frontend)
        run: npm ci

      - name: 3. Pruebas unitarias y de integración
        run: npm test

      - name: 4. Build del frontend
        run: npm run build

      - name: 5. Smoke test de la API
        env:
          DB_CONNECTION_STRING: mongodb://127.0.0.1:27017/cafecito_smoke_test
          PORT: 5000
          CORS_ORIGIN: http://localhost:5173
        run: |
          npm start > api.log 2>&1 &
          API_URL=http://localhost:5000/api npm run smoke --workspace=backend

      - name: Logs de la API si algo falló
        if: failure()
        run: cat api.log || true
